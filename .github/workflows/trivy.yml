name: trivy

# Wiederverwendbarer SCA-/Vulnerability-Scan (Dateisystem). Report landet in reports/trivy/.
# Blockierend bei HIGH/CRITICAL (nur Funde mit verfuegbarem Fix).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report-Ordner anlegen
        run: mkdir -p reports/trivy

      # The first call to the action will invoke setup-trivy and install trivy
      - name: Generate Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          output: reports/trivy/trivy-report.json
          format: json
          scan-ref: .
          exit-code: 0

      - name: Upload Vulnerability Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail build on High/Criticial Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: table
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          # On a subsequent call to the action we know trivy is already installed so can skip this
          skip-setup-trivy: true
