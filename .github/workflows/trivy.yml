name: trivy

# Wiederverwendbarer SCA-/Vulnerability-Scan (Dateisystem) inkl. Misconfigurations. Reports landen in reports/trivy/.
# Blockierend bei HIGH/CRITICAL (nur Funde mit verfuegbarem Fix). SARIF geht in den Security-Tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # fuer upload-sarif
      actions: read # nur fuer private Repos bei upload-sarif
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report-Ordner anlegen
        run: mkdir -p reports/trivy

      # The first call to the action will invoke setup-trivy and install trivy
      - name: Generate Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: vuln,misconfig
          output: reports/trivy/trivy-report.json
          format: json
          scan-ref: .
          exit-code: 0

      - name: Generate Trivy SARIF Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: vuln,misconfig
          output: reports/trivy/trivy-report.sarif
          format: sarif
          scan-ref: .
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload Vulnerability Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      # Fork-PRs haben nur Leserechte -> kein Upload in Code Scanning
      - name: SARIF in Code Scanning hochladen
        if: >-
          always() && hashFiles('reports/trivy/trivy-report.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy/trivy-report.sarif
          category: trivy-fs

      - name: Fail build on High/Criticial Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: vuln,misconfig
          format: table
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          # On a subsequent call to the action we know trivy is already installed so can skip this
          skip-setup-trivy: true
