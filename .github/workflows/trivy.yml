name: trivy

# Wiederverwendbarer SCA-/Vulnerability-Scan (Dateisystem) inkl. Misconfigurations. Reports landen in reports/trivy/.
# Blockierend bei HIGH/CRITICAL (nur Funde mit verfuegbarem Fix).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report-Ordner anlegen
        run: mkdir -p reports/trivy

      # The first call to the action will invoke setup-trivy and install trivy
      - name: Generate Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: vuln,misconfig
          output: reports/trivy/trivy-report.json
          format: json
          scan-ref: .
          exit-code: 0

      # Ohne Funde kein Report: leere Datei oder JSON ohne Vulnerabilities/Misconfigurations/Secrets wird entfernt
      - name: Leere Reports entfernen
        if: always()
        run: |
          f=reports/trivy/trivy-report.json
          if [ -f "$f" ] && { [ ! -s "$f" ] || jq -e '[.Results[]? | ((.Vulnerabilities // []) + (.Misconfigurations // []) + (.Secrets // []))] | length == 0' "$f" > /dev/null 2>&1; }; then
            rm "$f"
            echo "trivy: keine Fehler gefunden"
          fi

      - name: Upload Vulnerability Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail build on High/Criticial Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: vuln,misconfig
          format: table
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          # On a subsequent call to the action we know trivy is already installed so can skip this
          skip-setup-trivy: true
