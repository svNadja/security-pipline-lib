name: npm-audit

# Wiederverwendbare SCA fuer npm: findet alle package-lock.json im Repo und prueft jedes Projekt.
# Blockierend ab Severity high (--audit-level=high). Reports landen in reports/.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Alle npm-Projekte finden
        id: set-matrix
        run: |
          projects=$(find . -name "package-lock.json" -not -path "*/node_modules/*" \
            | sed 's|/package-lock.json$||; s|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Gefundene Projekte: $projects"
          echo "matrix=$projects" >> "$GITHUB_OUTPUT"

  npm-audit:
    needs: discover-projects
    if: needs.discover-projects.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit ausfuehren
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if [ ! -d reports ]; then
            mkdir reports
          fi
          name=$(echo "$PROJECT" | tr '/.' '__')
          [ "$PROJECT" = "." ] && name="root"
          cd "$PROJECT"
          npm audit --package-lock-only --audit-level=high --json > "$GITHUB_WORKSPACE/reports/npm-audit-$name.json"

      # Ohne Funde kein Report: leere Datei oder JSON ohne Vulnerabilities wird entfernt
      - name: Leere Reports entfernen
        if: always()
        run: |
          for f in reports/npm-audit-*.json; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ] || jq -e '.metadata.vulnerabilities.total == 0' "$f" > /dev/null 2>&1; then
              rm "$f"
              echo "npm-audit: keine Fehler gefunden ($(basename "$f"))"
            fi
          done

      - name: Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore
