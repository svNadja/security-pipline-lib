name: checkov

# Wiederverwendbarer IaC-Scan (Dockerfile, Compose, GitHub-Workflows, ...) ueber den ganzen Code.
# Reports landen in reports/checkov/.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read # fuer actions/checkout
      security-events: write # fuer upload-sarif
      actions: read # nur fuer private Repos bei upload-sarif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov installieren
        run: pip install checkov==3.3.29

      # Genau ein Ziel pro Format, gleiche Reihenfolge wie -o (cli, sarif, json)
      - name: Checkov
        run: |
          mkdir -p reports/checkov
          checkov -d . --skip-path reports \
            -o cli -o sarif -o json \
            --output-file-path console,reports/checkov/results.sarif,reports/checkov/results.json

      # Fork-PRs haben nur Leserechte -> kein Upload in Code Scanning
      - name: SARIF in Code Scanning hochladen
        if: >-
          always() && hashFiles('reports/checkov/*.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov

      - name: Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-reports
          path: reports/
          if-no-files-found: ignore
