name: bandit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read # nur fuer private Repos bei upload-sarif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install bandit
        run: python3 -m pip install bandit

      - name: bandit
        run: bash scripts/bandit.sh

      - name: Report als Job Summary
        if: always()
        run: |
          {
            echo "## Bandit Report"
            echo
            if [ -f reports/bandit/bandit-report.json ]; then
              echo '```'
              python3 -m bandit -r . -x ./.venv,./reports -f txt 2>/dev/null || true
              echo '```'
            else
              echo "Kein Report erzeugt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: reports/
          if-no-files-found: ignore
