name: bandit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install bandit
        run: python3 -m pip install bandit

      # Befehl inline (entspricht scripts/bandit.sh): bei workflow_call enthaelt der
      # Checkout das aufrufende Repo, nicht dieses -> scripts/ ist dort nicht vorhanden.
      - name: bandit
        run: |
          mkdir -p reports/bandit
          # Bandit liefert Exit 1 bei jedem Fund; die Policy steht im Schritt "Policy" unten
          python3 -m bandit -r . -x ./.venv,./reports -f json -o reports/bandit/bandit-report.json || true
          test -f reports/bandit/bandit-report.json

      - name: Report als Job Summary
        if: always()
        run: |
          {
            echo "## Bandit Report"
            echo
            if [ -f reports/bandit/bandit-report.json ]; then
              echo '```'
              python3 -m bandit -r . -x ./.venv,./reports -f txt 2>/dev/null || true
              echo '```'
            else
              echo "Kein Report erzeugt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Ohne Funde kein Report: leere Datei oder JSON ohne results/errors wird entfernt
      - name: Leere Reports entfernen
        if: always()
        run: |
          f=reports/bandit/bandit-report.json
          if [ -f "$f" ] && { [ ! -s "$f" ] || jq -e '(.results | length) == 0 and (.errors | length) == 0' "$f" > /dev/null 2>&1; }; then
            rm "$f"
            echo "bandit: keine Fehler gefunden"
          fi

      - name: Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: reports/
          if-no-files-found: ignore

      - name: Policy (blockiert nur HIGH, MEDIUM/LOW nur Bericht)
        run: |
          # Kein Report = keine Funde (Report wird ohne Funde entfernt)
          high=0
          [ -f reports/bandit/bandit-report.json ] && high=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' reports/bandit/bandit-report.json)
          echo "Bandit HIGH-Funde: $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::Bandit: $high HIGH-Funde"
            exit 1
          fi
