name: CI-openbao

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: OpenBao-Image bauen
        run: docker build -f docker/Dockerfile -t openbao-custom:ci .

      - name: Container starten und Health pruefen
        run: |
          docker run -d --name openbao --cap-add IPC_LOCK -p 8200:8200 openbao-custom:ci
          for _ in $(seq 1 30); do
            curl -fs "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200" && exit 0
            sleep 1
          done
          docker logs openbao
          exit 1
