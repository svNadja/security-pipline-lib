name: CI-openbao

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: OpenBao-Image bauen
        run: docker build -f docker/Dockerfile -t openbao-custom:ci .

      - name: Container starten und Health pruefen
        run: |
          mkdir -p reports/openbao
          docker run -d --name openbao --cap-add IPC_LOCK -p 8200:8200 openbao-custom:ci
          rc=1
          for _ in $(seq 1 30); do
            if curl -fs "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200" > reports/openbao/health.json; then
              rc=0
              break
            fi
            sleep 1
          done
          docker logs openbao > reports/openbao/container.log 2>&1
          exit $rc

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbao-report
          path: reports/
          if-no-files-found: ignore
